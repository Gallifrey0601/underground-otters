<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong MTR Memory Game</title>
    <meta name="description" content="Hong Kong MTR Memory Game - Test your knowledge of all 98 MTR stations">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <h1>Hong Kong MTR Memory Game</h1>
            <div class="progress-info">
                <span class="percentage">0.0%</span>
                <span class="station-count">0/98 stations found</span>
            </div>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="stationInput" 
                class="station-input" 
                placeholder="Type station name..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="resetBtn" class="reset-btn">Reset</button>
        </div>

        <!-- Interactive Hong Kong MTR Map -->
        <div class="map-section">
            <div class="map-container">
                <svg class="mtr-map" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background -->
                    <rect width="1000" height="700" fill="#f8f9fa"/>
                    
                    <!-- Hong Kong Geographic Outlines (simplified) -->
                    <!-- Hong Kong Island -->
                    <path d="M200 450 Q300 440 400 450 Q500 460 600 450 Q650 445 680 450" 
                          stroke="#e0e0e0" stroke-width="2" fill="none" opacity="0.3"/>
                    
                    <!-- Kowloon Peninsula -->
                    <path d="M300 350 Q400 340 500 350 Q550 355 580 350" 
                          stroke="#e0e0e0" stroke-width="2" fill="none" opacity="0.3"/>
                    
                    <!-- New Territories -->
                    <path d="M200 200 Q400 180 600 200 Q700 210 800 200" 
                          stroke="#e0e0e0" stroke-width="2" fill="none" opacity="0.3"/>
                    
                    <!-- Lantau Island -->
                    <path d="M100 500 Q150 490 200 500 Q220 510 200 520 Q150 530 100 520 Z" 
                          stroke="#e0e0e0" stroke-width="2" fill="none" opacity="0.2"/>

                    <!-- Island Line (Blue) - Following Hong Kong Island North Shore -->
                    <g class="line-group" data-line="Island Line">
                        <path d="M220 450 L680 450" stroke="#0073e6" stroke-width="5" class="line-path"/>
                        
                        <!-- Island Line Stations -->
                        <g class="station-marker" data-station="Kennedy Town">
                            <circle cx="220" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>
                            <text x="220" y="435" class="station-label">Kennedy Town</text>
                        </g>
                        <g class="station-marker" data-station="HKU">
                            <circle cx="250" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>
                            <text x="250" y="435" class="station-label">HKU</text>
                        </g>
                        <g class="station-marker" data-station="Sai Ying Pun">
                            <circle cx="280" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>
                            <text x="280" y="435" class="station-label">Sai Ying Pun</text>
                        </g>
                        <g class="station-marker" data-station="Sheung Wan">
                            <circle cx="310" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>
                            <text x="310" y="435" class="station-label">Sheung Wan</text>
                        </g>
                        <g class="station-marker" data-station="Central">
                            <circle cx="350" cy="450" r="6" fill="white" stroke="#0073e6" stroke-width="3"/>
                            <text x="350" y="435" class="station-label major">Central</text>
                        </g>
                        <g class="station-marker" data-station="Admiralty">
                            <circle cx="380" cy="450" r="6" fill="white" stroke="#0073e6" stroke-width="3"/>
                            <text x="380" y="435" class="station-label major">Admiralty</text>
                        </g>
                        <g class="station-marker" data-station="Wan Chai">
                            <circle cx="410" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>
                            <text x="410" y="435" class="station-label">Wan Chai</text>
                        </g>
                        <g class="station-marker" data-station="Causeway Bay">
                            <circle cx="440" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>

                            <circle cx="470" cy="450" r="4" fill="white" stroke="#0073e6" stroke-width="2"/>
                            <text x="470" y="435" class="station-label">Tin Hau</text>

                    <!-- Tsuen Wan Line (Red) - From Central across harbour to Kowloon then northwest -->

                        <g class="station-marker" data-station="Kwai Fong">
                            <circle cx="220" cy="255" r="4" fill="white" stroke="#ff0000" stroke-width="2"/>
                            <text x="180" y="255" class="station-label">Kwai Fong</text>
                        </g>
                        <g class="station-marker" data-station="Kwai Hing">
                            <circle cx="210" cy="252" r="4" fill="white" stroke="#ff0000" stroke-width="2"/>
                            <text x="170" y="252" class="station-label">Kwai Hing</text>
                        </g>
                        <g class="station-marker" data-station="Tai Wo Hau">

                        <g class="station-marker" data-station="Tsuen Wan">

                    <!-- Kwun Tong Line (Green) - From Kowloon northeast to eastern areas -->

                        <g class="station-marker" data-station="Lok Fu">
                            <circle cx="420" cy="340" r="4" fill="white" stroke="#00a651" stroke-width="2"/>

                        <g class="station-marker" data-station="Wong Tai Sin">
                            <circle cx="440" cy="330" r="4" fill="white" stroke="#00a651" stroke-width="2"/>

                        <g class="station-marker" data-station="Diamond Hill">
                            <circle cx="460" cy="320" r="4" fill="white" stroke="#00a651" stroke-width="2"/>
                            <text x="460" y="305" class="station-label">Diamond Hill</text>
                        </g>
                        <g class="station-marker" data-station="Choi Hung">
                            <circle cx="480" cy="310" r="4" fill="white" stroke="#00a651" stroke-width="2"/>
                            <text x="480" y="295" class="station-label">Choi Hung</text>
                        </g>
                        <g class="station-marker" data-station="Kowloon Bay">
                            <circle cx="500" cy="300" r="4" fill="white" stroke="#00a651" stroke-width="2"/>
                            <text x="500" y="285" class="station-label">Kowloon Bay</text>
                        </g>
                        <g class="station-marker" data-station="Ngau Tau Kok">
                            <circle cx="520" cy="290" r="4" fill="white" stroke="#00a651" stroke-width="2"/>
                            <text x="520" y="275" class="station-label">Ngau Tau Kok</text>
                        </g>
                        <g class="station-marker" data-station="Kwun Tong">
                            <circle cx="540" cy="280" r="6" fill="white" stroke="#00a651" stroke-width="3"/>
                            <text x="540" y="265" class="station-label major">Kwun Tong</text>
                        </g>
                        <g class="station-marker" data-station="Lam Tin">
                            <circle cx="580" cy="270" r="4" fill="white" stroke="#00a651" stroke-width="2"/>

                        <g class="station-marker" data-station="Yau Tong">

                        <g class="station-marker" data-station="Tiu Keng Leng">

                        </g>
                    </g>

                    <!-- Tseung Kwan O Line (Purple) - Branching from Kwun Tong Line to southeast -->

                        <path d="M530 450 L650 250 L750 200" stroke="#8e4ec6" stroke-width="5" class="line-path"/>
                        
                        <g class="station-marker" data-station="Tseung Kwan O">
                            <circle cx="700" cy="220" r="6" fill="white" stroke="#8e4ec6" stroke-width="3"/>

                        <g class="station-marker" data-station="Hang Hau">

                    <!-- Tung Chung Line (Orange) - From Central to Lantau Island -->
                    <g class="line-group" data-line="Tung Chung Line">

                        <g class="station-marker" data-station="Hong Kong">
                            <circle cx="350" cy="470" r="6" fill="white" stroke="#ff9500" stroke-width="3"/>

                        </g>
                        <g class="station-marker" data-station="Olympic">
