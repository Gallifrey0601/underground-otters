<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong MTR Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <h1>Hong Kong MTR Memory Game</h1>
            <div class="progress-info">
                <span class="percentage">0.0%</span>
                <span class="station-count">0/98 stations found</span>
            </div>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="stationInput" 
                class="station-input" 
                placeholder="Type station name..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="resetBtn" class="reset-btn">Reset</button>
        </div>

        <!-- Interactive Map - JavaScript will populate ALL stations -->
        <div class="map-section">
            <div class="map-container">
                <svg id="mtrMap" class="mtr-map" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Clean background -->
                    <rect width="1000" height="600" fill="white"/>
                    <!-- JavaScript will create ALL stations and lines here -->
                </svg>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
