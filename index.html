<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong MTR Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1>Hong Kong MTR Memory Game</h1>
            <div class="progress-info">
                <span class="percentage">0.0%</span>
                <span class="station-count">0/98 stations found</span>
            </div>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="stationInput" 
                class="station-input" 
                placeholder="Type station name..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="resetBtn" class="reset-btn">Reset</button>
        </div>

        <!-- ONLY INTERACTIVE MAP - NO STATION NAMES IN HTML -->
        <div class="map-section">
            <div class="map-container">
                <svg id="mtrMap" class="mtr-map" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background -->
                    <rect width="1000" height="600" fill="#f8f9fa"/>
                    
                    <!-- Hong Kong Island outline (simplified) -->
                    <path d="M50 450 Q200 440 400 450 Q600 460 750 450" stroke="#e0e0e0" stroke-width="1" fill="none" opacity="0.3"/>
                    
                    <!-- Kowloon outline -->
                    <path d="M200 300 Q400 290 600 300" stroke="#e0e0e0" stroke-width="1" fill="none" opacity="0.3"/>
                    
                    <!-- New Territories outline -->
                    <path d="M100 100 Q300 80 600 100 Q800 110 900 100" stroke="#e0e0e0" stroke-width="1" fill="none" opacity="0.3"/>
                    
                    <!-- JavaScript will add ALL lines and stations here -->
                </svg>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
