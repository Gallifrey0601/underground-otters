<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong MTR Memory Game</title>
    <meta name="description" content="Hong Kong MTR Memory Game - Test your knowledge of all 98 MTR stations">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <h1>Hong Kong MTR Memory Game</h1>
            <div class="progress-info">
                <span class="percentage">0.0%</span>
                <span class="station-count">0/98 stations found</span>
            </div>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="stationInput" 
                class="station-input" 
                placeholder="Type station name..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="resetBtn" class="reset-btn">Reset</button>
        </div>

                            <circle cx="750" cy="350" r="4" fill="#8d5524"/>
                            <text x="770" y="355" class="station-label hidden">Wu Kai Sha</text>
                        </g>
                    </g>

                    <!-- South Island Line (Yellow) -->
                    <g class="line-group">
                        <path d="M 250 300 L 300 400" stroke="#ffda00" stroke-width="3" class="line-path"/>
                        
                        <g class="station-marker" data-station="Ocean Park">
                            <circle cx="260" cy="330" r="4" fill="#ffda00"/>
                            <text x="280" y="335" class="station-label hidden">Ocean Park</text>
                        </g>
                        <g class="station-marker" data-station="Wong Chuk Hang">
                            <circle cx="270" cy="350" r="4" fill="#ffda00"/>
                            <text x="290" y="355" class="station-label hidden">Wong Chuk Hang</text>
                        </g>
                        <g class="station-marker" data-station="Lei Tung">
                            <circle cx="280" cy="370" r="4" fill="#ffda00"/>
                            <text x="300" y="375" class="station-label hidden">Lei Tung</text>
                        </g>
                        <g class="station-marker" data-station="South Horizons">
                            <circle cx="300" cy="400" r="4" fill="#ffda00"/>
                            <text x="320" y="405" class="station-label hidden">South Horizons</text>
                        </g>
                    </g>

                    <!-- Disneyland Resort Line (Pink) -->
                    <g class="line-group">
                        <path d="M 60 435 L 40 500" stroke="#ff69b4" stroke-width="3" class="line-path"/>
                        
                        <g class="station-marker" data-station="Disneyland Resort">
                            <circle cx="40" cy="500" r="5" fill="#ff69b4"/>
                            <text x="45" y="515" class="station-label hidden major">Disneyland Resort</text>
                        </g>
                    </g>
                </svg>
            </div>
        </div>

        <!-- Station Details Section (Expandable) -->
        <div class="details-section">
            <button class="toggle-details" onclick="toggleDetails()">📋 Show Station Lists</button>
            <div class="station-lists hidden" id="stationLists">
                <!-- Station lists content here -->
                <div class="lines-grid">
                    <!-- Lines will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
