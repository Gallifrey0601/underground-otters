<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong MTR Memory Game</title>
    <meta name="description" content="Hong Kong MTR Memory Game - Test your knowledge of all 98 MTR stations">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <h1>Hong Kong MTR Memory Game</h1>
            <div class="progress-info">
                <span class="percentage">0.0%</span>
                <span class="station-count">0/98 stations found</span>
            </div>
        </header>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="stationInput" 
                class="station-input" 
                placeholder="Type station name..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="resetBtn" class="reset-btn">Reset</button>
        </div>

        <!-- Clean Hong Kong MTR Map -->
        <div class="map-section">
            <div class="map-container">
                <svg class="mtr-map" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Clean white background -->
                    <rect width="1000" height="600" fill="white"/>
                    
                    <!-- Island Line (Blue) - Hong Kong Island North Shore -->
                    <g class="line-group" data-line="Island Line">
                        <path d="M100 400 L750 400" stroke="#0073e6" stroke-width="4" class="line-path"/>
                        
                        <!-- Island Line Stations - Hidden by default -->
                        <g class="station-marker" data-station="Kennedy Town">
                            <circle cx="100" cy="400" r="5" fill="#0073e6" opacity="0"/>
                            <text x="100" y="385" class="station-label">Kennedy Town</text>
                        </g>
                        <g class="station-marker" data-station="HKU">
                            <circle cx="140" cy="400" r="5" fill="#0073e6" opacity="0"/>

                        <g class="station-marker" data-station="Sheung Wan">
                            <circle cx="220" cy="400" r="5" fill="#0073e6" opacity="0"/>
